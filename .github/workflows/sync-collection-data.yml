name: Sync collection data

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: Trigger source
        required: false
        default: manual
        type: string
  schedule:
    # Hourly GitHub backup. The 10-minute primary schedule is handled by Cloudflare.
    - cron: "43 * * * *"

concurrency:
  group: sync-collection-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Record trigger
        env:
          SYNC_TRIGGER: ${{ inputs.trigger || github.event_name }}
        run: |
          echo "Triggered by: ${SYNC_TRIGGER}"
          echo "### Collection data sync" >> "$GITHUB_STEP_SUMMARY"
          echo "Trigger: \`${SYNC_TRIGGER}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build collection JSON
        id: build
        run: |
          set +e
          failed=0
          : > /tmp/collection-sync-failures.txt

          for config in sources/collections/*.json; do
            echo "Building ${config}"
            if node scripts/build-collection-json.mjs "$config"; then
              echo "OK ${config}"
            else
              failed=1
              echo "FAILED ${config}" | tee -a /tmp/collection-sync-failures.txt
            fi
          done

          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          commit_message: Update collection data
          file_pattern: public/data/collections/**/*.json public/data/manifest.json

      - name: Report collection sync failures
        if: steps.build.outputs.failed == '1'
        run: |
          echo "Some collection configs failed:"
          cat /tmp/collection-sync-failures.txt
          exit 1
